# Fix-Verifikationslauf (14.08.): Gemma4-REAP deckt alle 3 Fixes ab
#   - REAP-Key-Auflösung (_resolve_models + _model_supports_reasoning) -> DS1000/CoderEval
#   - EvalPlus make_model max_new_tokens -> HumanEval+/MBPP+
#   - tool_eval_bench in Python 3.12 -> Agentic
# SS=10 (Funktionscheck), np=4, seed 2026
# Verwendung: python src\run_benchmarks.py --run-spec run.verify-fixes.yaml

models:
  - "gemma4-26b-a4b-reap-25"

benchmarks: ["DS1000", "CoderEval", "HumanEval+", "MBPP+", "Agentic"]

sample_size: 10
seed: 2026
agentic_mode: "random"
thinking: false
no_structured_output: false
unload_between: false
keep_response: false