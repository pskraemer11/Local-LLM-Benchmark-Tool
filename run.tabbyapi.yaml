# Run-Spec fuer Benchmarks gegen TabbyAPI (exllamav3-Backend, Port 5000).
# Verwendung:  .\run-tabbyapi.ps1
# Precedence:   CLI-Flags > Werte hier > Skript-Defaults.

# EXL3-Modelle (geladen in TabbyAPI/models/); Namen matchen die LM-Studio-Keys,
# die der Benchmark als model= an die API sendet.
models: ["google_gemma-4-26b-a4b-it", "devstral-small-2-24b-instruct-2512"]

# Gleiche Benchmark-Auswahl wie die bisherigen Konsolidierungslaeufe.
benchmarks: ["DS1000", "CoderEval", "HumanEval+", "MBPP+", "ARC-Challenge",
             "HellaSwag", "TruthfulQA", "IFEval", "MATH-500", "Agentic"]

sample_size: 30
seed: 2026

# Agentic: "random" (alle 69 Szenarien) oder "safety" (nur 13 Category-K).
agentic_mode: "random"

thinking: false
no_structured_output: false
unload_between: false
keep_response: false
