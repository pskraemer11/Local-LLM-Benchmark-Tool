# pytest-Konfiguration (Ruff/pylint/mypy siehe .ruff.toml und .pyproject.toml).
# pytest erkennt NUR unversteckte Konfigurationsdateien (pyproject.toml, pytest.ini,
# tox.ini, setup.cfg) - deshalb wird dieser Block hier gefuehrt.

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
addopts = "-v --tb=short"
