[tool.ruff]
# Prio 4.15 (Code-Review_2026-07-12.md §4 Prio 4) 
# minimal config for ruff, mypy, pylint and pytest.
# Ergänzungen aus Mistral/Vibe 
# https://chat.mistral.ai/work/e4dd489b-946d-412d-9538-ec17a803c108
line-length = 120
target-version = "py314"
# alt: target-version = "py311"

# Don't lint the Archiv, Bibliotheken, etc. folder (legacy code)
extend-exclude = [
    ".devin/*",
    ".git/*",
    ".github/*",
    ".mypy_cache/*",
    ".pytest_cache/*",
    ".ruff_cache/*",
    "__pycache__/*",
    ".venv/*",        # Virtuelle Umgebung
    "*.md",           # Markdown-Dateien
    "*.yaml",          # YAML-Dateien (z. B. model_registry.yaml)
    "*.json",         # JSON-Dateien
    "Archiv/*", 
    "backups/*", 
    "build/*", 
    "data/*", 
    "dist/*", 
    "doc-git/*", 
    "Doku-intern/*", 
    "ds1000_official/*", 
    "embedding-eval/*", 
    "ergebnisse/*", 
    "human_eval_plus/*", 
    "human-eval/*", 
    "lm_eval_tasks/*", 
    "logs/*", 
    "runs/*", 
    "simple_evals",
    "tests/*",        # Testdateien
]

[tool.ruff.lint]
# Lenient default: catch E (errors) and F (pyflakes), ignore style.
# Run `ruff check` in CI; run `ruff format` manually for style.
# select = ["E", "F"]

## alt: select = ["ALL"]
# Nur relevante Regelgruppen aktivieren
select = [
    # **Kritische** Fehler (immer prüfen)
    "F",     # Pyflakes (Syntaxfehler, ungenutzte Imports)
    "B",     # Enable flake8-bugbear (`B`) (logische Fehler, z. B. unsichere Defaults)
    "S",     # Bandit (Sicherheitslücken, z. B. eval(), pickle)
    
#    "E",    # Pycodestyle errors
#    "W",    # Pycodestyle warnings
#    "D",    # Docstrings (pydocstyle)
    
    # Typ-Hints (hohe Relevanz für Projekt)
    "ANN",   # Type annotations (fehlende Typen)
    
    # Performance (kritisch für Benchmark-Tool)
    "PERF",  # Performance-Probleme (z. B. ineffiziente Loops)
    
    # Wartbarkeit (mittlere Relevanz)
    "I",     # Isort (Import-Sortierung)
    "UP",    # Pyupgrade (veraltete Syntax, z. B. Python 3.9+ Features)
    "C4",    # Comprehensions (List/Dict/Set Comprehensions)
    "TCH",   # Type checking (z. B. `if isinstance(x, int):` → `isinstance(x, int)`)
    "FBT",   # Booleans (z. B. `if x == True:` → `if x:`)
    "Q",     # Quotes (String-Quotes Konsistenz)
    "RUF",   # Ruff-spezifische Regeln
]


# Regeln ignorieren, die für dein Projekt nicht relevant sind
ignore = [
    # Type hints (ANN)
    "ANN101", # Missing type annotation for `self` in method (oft redundant)
    "ANN102", # Missing type annotation for `cls` in classmethod
    "ANN401", # Dynamically typed expressions (manchmal nötig für Benchmarks)
    
    # Bugbear (B)
    "B008",   # Do not perform function calls in argument defaults (manchmal nötig)
    "B011",   # Do not call assert False (kann in Tests sinnvoll sein)
    
    # Bandit (S)
    "S101",   # Use of `assert` detected (kann in Tests/Benchmarks nötig sein)
    "S311",   # Use of `random` detected (für Benchmarks oft nötig)
    
    # Performance (PERF)
    "PERF203", # `try`-`except` within a loop (manchmal unvermeidbar)
    "PERF401", # Use `list` comprehension instead of `for` loop (Lesbarkeit > Performance)
    
    # Pycodestyle (E/W)
    "E501",   # Line too long (wird durch line-length=120 abgedeckt)
]

# Autofix für sichere Regeln (nicht für ANN/S/PERF)
fixable = ["F", "B", "E", "W", "I", "UP", "C4", "Q"]
unfixable = ["ANN", "S", "PERF", "TCH", "FBT", "RUF"]

# 4. Ignore `E402` (import violations) in all `__init__.py` files, and in selected subdirectories.
[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402"]
"**/{tests,docs,tools}/*" = ["E402"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
addopts = "-v --tb=short"

# neu aufgenommen zur Ergänzung von Lücken bei Ruff, aber viele disable gegen False Negativ Meldungen:
[tool.pylint.main]
disable = ["all"]
enable = ["R0902", "R0903", "R0913", "R0914", "R0801"]

[tool.mypy]
# Lenient settings: legacy research codebase with gradual typing.
# python_version = "3.11"
python_version = "3.14"
ignore_missing_imports = true
# no_strict_optional = true
strict = true
warn_unused_ignores = false
warn_redundant_casts = false

# Cache für schnellere Ausführung
cache-dir = ".ruff_cache"

