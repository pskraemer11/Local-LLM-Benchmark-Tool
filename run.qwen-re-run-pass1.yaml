  - "qwen2.5-coder-14b-instruct@q5_k_m"
  - "qwen2.5-coder-14b-instruct@q6_k"
  # Qwen3-14B (fehlte komplett)
  - "qwen/qwen3-14b"
  # Qwen3.5-9B (fehlte komplett)
  - "qwen/qwen3.5-9b"
  # Qwen3-30B-A3B (DS1000/CoderEval=0 Harness-Problem, neu nachlaufen)
  - "qwen3-30b-a3b-instruct-2507-q2ks-mixed-autoround"
  - "qwen3-30b-a3b-thinking-2507-q2ks-mixed-autoround"
  # Qwen3-Coder-30B (nur alte Daten)
  - "qwen3-coder-30b-a3b-instruct-q2ks-mixed-autoround"
  # Qwen3-Coder-REAP-25B (nur alte Daten)
  - "qwen3-coder-reap-25b-a3b-i1"
  # Qwen3.6-27B (nur alte Daten)
  - "qwen3.6-27b"
