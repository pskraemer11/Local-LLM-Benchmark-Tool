name: Pre-Review Checks
on: [push]

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  lint:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip ruff
      - run: ruff check --select E,F --ignore E501,F401,E402 .

  mypy:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install mypy types-requests types-PyYAML
      - run: |
          python -m mypy --ignore-missing-imports `
            --no-strict-optional `
            --follow-imports=silent `
            --warn-return-any `
            src/benchmark_config.py `
            src/csv_writer.py

  validate-registry:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install ruamel.yaml psutil gguf
      # CI-Modus prueft nur statische Registry-/Template-Regeln.
      # LM-Studio-Configs, Hub und lokale GGUF-Dateien existieren hier nicht.
      - run: python .\src\registry_tool.py validate --ci

  test:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install "lm-eval[api,math]" evalplus nvidia-ml-py3 psutil ruamel.yaml
          python -m pip install pytest pytest-cov pytest-mock responses gguf
          python -m pip install langdetect immutabledict "antlr4-python3-runtime==4.11" nltk
      # pyproject.toml disables pytest's workspace cache; each runner keeps
      # its own OS-managed numbered temp root.
      - run: python -m pytest tests/ -v --tb=short
