# Qwen-Nachlauf — Pass 2: Andere fehlende Modelle mit aktuellem Setup
# SS=30, np=4, aktuelle Temperaturen (laut benchmark_config.py)
# Verwendung: python src\run_benchmarks.py --run-spec run.qwen-re-run-pass2.yaml

models:
  # GLM-4.6V (fehlte komplett)
  - "zai-org/glm-4.6v-flash"
  # Gemma4-26B-REAP-25 (fehlte komplett)
  - "gemma4-26b-a4b-reap-25"
  # Phi-4 (fehlte komplett)
  - "unsloth/phi-4"
  # RNJ-1 (fehlte komplett)
  - "essentialai/rnj-1"
  # F2LLM-v2 (fehlten komplett)
  - "f2llm-v2-4b"
  - "f2llm-v2-1.7b"
  # Em German (fehlten komplett)
  - "em_german_13b_v01"
  - "em_german_leo_mistral"

benchmarks: ["DS1000", "CoderEval", "HumanEval+", "MBPP+", "ARC-Challenge",
             "HellaSwag", "TruthfulQA", "IFEval", "MATH-500", "Agentic"]

sample_size: 30
seed: 2026
agentic_mode: "random"
thinking: false
no_structured_output: false
unload_between: false
keep_response: false
